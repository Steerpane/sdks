# Push a tag like v0.1.1 to test and publish. No registry tokens: PyPI and npm trust this workflow by name (PUBLISHING.md).
# A package whose version is already on its registry is skipped, so re-running after a partial failure is safe.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # lets PyPI and npm confirm this workflow is the publisher
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Trusted publishing needs a recent npm
        run: npm install -g npm@11
      - name: The tag must match the Python package's version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' python/pyproject.toml)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME doesn't match version $version"; exit 1; }
      - name: Test
        run: |
          uv venv --python 3.12 && uv pip install -e "./python[playwright]" pytest pyright
          .venv/bin/python -m pytest -q python/tests
          .venv/bin/pyright --pythonpath .venv/bin/python -p python/pyproject.toml
          npm ci && npm run build && npm test
      - name: Build and check every package
        run: python scripts/publish_dry_run.py --out release-files
      - name: Publish steerpane-sdk to PyPI
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' python/pyproject.toml)
          if curl -fs "https://pypi.org/pypi/steerpane-sdk/$version/json" > /dev/null; then
            echo "steerpane-sdk $version is already on PyPI"
          else
            uv publish --trusted-publishing always release-files/steerpane_sdk-"$version"*
          fi
      - name: Publish the SDK and then the CLI to npm
        run: |
          for folder in node cli; do
            name=$(node -p "require('./$folder/package.json').name")
            version=$(node -p "require('./$folder/package.json').version")
            if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "$name $version is already on npm"
            else
              file="release-files/$(echo "$name" | sed 's/^@//; s#/#-#')-$version.tgz"
              npm publish "$file" --access public --provenance
            fi
          done
