[project]
name = "steerpane-sdk"
version = "0.1.0"
description = "Python client for Steerpane: remote browsers for AI agents, with human takeover."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Steerpane" }]
keywords = ["browser", "automation", "agents", "playwright", "cdp", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
playwright = ["playwright>=1.45"]

[project.urls]
Homepage = "https://steerpane.app"
Repository = "https://github.com/Steerpane/sdks"

[dependency-groups]
dev = ["pytest>=8", "pyright>=1.1.380", "build>=1.2", "twine>=5"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steerpane"]

[tool.hatch.build.targets.sdist]
include = ["src/steerpane", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a running API (STEERPANE_API_URL and STEERPANE_API_TOKEN)"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
