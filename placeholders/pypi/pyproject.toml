[project]
name = "steerpane"
version = "0.0.1"
description = "Placeholder. Install steerpane-sdk for the Python client."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Steerpane" }]

[project.urls]
Homepage = "https://steerpane.app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steerpane_placeholder"]

[tool.hatch.build.targets.sdist]
include = ["src/steerpane_placeholder", "README.md", "LICENSE", "pyproject.toml"]
